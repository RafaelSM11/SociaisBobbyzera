<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links - Bobbyzera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.4) 0%, rgba(15, 23, 42, 0.75) 100%), 
                        url('https://i.postimg.cc/TYjxLtdG/background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        
        .link-card {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .link-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .btn-twitch { background-color: rgba(145, 70, 255, 0.9); }
        .btn-twitch:hover { box-shadow: 0 0 15px #9146FF; transform: scale(1.02); background-color: rgba(145, 70, 255, 1); }

        .btn-kick { background-color: rgba(83, 252, 24, 0.9); color: #000; }
        .btn-kick:hover { box-shadow: 0 0 15px #53FC18; transform: scale(1.02); background-color: rgba(83, 252, 24, 1); }

        .btn-youtube { background-color: rgba(255, 0, 0, 0.9); }
        .btn-youtube:hover { box-shadow: 0 0 15px #FF0000; transform: scale(1.02); background-color: rgba(255, 0, 0, 1); }

        .btn-instagram { background: linear-gradient(45deg, rgba(240, 148, 51, 0.9) 0%, rgba(230, 104, 60, 0.9) 25%, rgba(220, 39, 67, 0.9) 50%, rgba(204, 35, 102, 0.9) 75%, rgba(188, 24, 136, 0.9) 100%); }
        .btn-instagram:hover { box-shadow: 0 0 15px #dc2743; transform: scale(1.02); background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }

        .btn-tiktok { background-color: rgba(0, 0, 0, 0.8); border: 1px solid rgba(255,255,255,0.05); }
        .btn-tiktok:hover { box-shadow: -3px 3px 15px #25F4EE, 3px -3px 15px #FE2C55; transform: scale(1.02); background-color: rgba(0, 0, 0, 1); }

        .section-title {
            opacity: 0;
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-6">

    <!-- Alterado de max-w-md para max-w-sm para ficar mais estreito, e space-y-8 no lugar de 10 -->
    <div class="max-w-sm w-full flex flex-col items-center space-y-8">
        
        <!-- Seção do Perfil -->
        <div class="flex flex-col items-center space-y-3 section-title" style="animation-delay: 0.1s;">
            <!-- Avatar diminuído de w-32 h-32 para w-24 h-24 -->
            <img src="https://i.postimg.cc/k4GzTcPr/IMG-20261110-210217.jpg" alt="Bobbyzera Avatar" class="w-24 h-24 rounded-full border-4 border-slate-700/50 shadow-xl object-cover">
            <div class="text-center">
                <!-- Fonte diminuída de text-3xl para text-2xl -->
                <h1 class="text-2xl font-bold tracking-wide drop-shadow-lg">Bobbyzera</h1>
                <p class="text-slate-200 mt-1 text-sm font-medium drop-shadow-md">Acompanhe as lives e os melhores momentos!</p>
            </div>
        </div>

        <!-- Categoria: LIVE -->
        <!-- Reduzido o espaçamento entre botões para space-y-3 -->
        <div class="w-full flex flex-col space-y-3">
            <h2 class="text-xs font-bold text-slate-200 tracking-[0.2em] uppercase text-center mb-1 section-title drop-shadow-md" style="animation-delay: 0.2s;">Live</h2>
            
            <!-- Botões com padding menor (py-3 px-4), fonte menor (text-base) e ícones menores (w-5 h-5) -->
            <a href="https://www.twitch.tv/bobbyzera" target="_blank" rel="noopener noreferrer" class="link-card btn-twitch w-full py-3 px-4 rounded-xl font-bold text-center text-base flex items-center justify-center space-x-3 shadow-lg">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>
                <span>Twitch</span>
            </a>

            <a href="https://kick.com/bobbyzera" target="_blank" rel="noopener noreferrer" class="link-card btn-kick w-full py-3 px-4 rounded-xl font-bold text-center text-base flex items-center justify-center space-x-3 shadow-lg">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M2 2h20v20H2zm5.5 5.5v9h3v-3h1.5v3h3v-9h-3v3h-1.5v-3z"/></svg>
                <span>Kick</span>
            </a>
        </div>

        <!-- Categoria: REDES SOCIAIS -->
        <div class="w-full flex flex-col space-y-3">
            <h2 class="text-xs font-bold text-slate-200 tracking-[0.2em] uppercase text-center mb-1 mt-3 section-title drop-shadow-md" style="animation-delay: 0.4s;">Redes Sociais</h2>
            
            <a href="https://www.youtube.com/@bobbyzeraoficial" target="_blank" rel="noopener noreferrer" class="link-card btn-youtube w-full py-3 px-4 rounded-xl font-bold text-center text-base flex items-center justify-center space-x-3 shadow-lg">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M21.582 6.186a2.636 2.636 0 0 0-1.854-1.865C17.904 3.864 12 3.864 12 3.864s-5.904 0-7.728.457a2.636 2.636 0 0 0-1.854 1.865C1.96 8.016 1.96 12 1.96 12s0 3.984.458 5.814a2.636 2.636 0 0 0 1.854 1.865c1.824.457 7.728.457 7.728.457s5.904 0 7.728-.457a2.636 2.636 0 0 0 1.854-1.865c.458-1.83.458-5.814.458-5.814s0-3.984-.458-5.814zM9.91 15.184V8.816L15.42 12l-5.51 3.184z"/></svg>
                <span>Bobbyzera Oficial</span>
            </a>

            <a href="https://www.youtube.com/@bobbyzeragames" target="_blank" rel="noopener noreferrer" class="link-card btn-youtube w-full py-3 px-4 rounded-xl font-bold text-center text-base flex items-center justify-center space-x-3 shadow-lg">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M21.582 6.186a2.636 2.636 0 0 0-1.854-1.865C17.904 3.864 12 3.864 12 3.864s-5.904 0-7.728.457a2.636 2.636 0 0 0-1.854 1.865C1.96 8.016 1.96 12 1.96 12s0 3.984.458 5.814a2.636 2.636 0 0 0 1.854 1.865c1.824.457 7.728.457 7.728.457s5.904 0 7.728-.457a2.636 2.636 0 0 0 1.854-1.865c.458-1.83.458-5.814.458-5.814s0-3.984-.458-5.814zM9.91 15.184V8.816L15.42 12l-5.51 3.184z"/></svg>
                <span>Bobbyzera Games</span>
            </a>

            <a href="https://www.tiktok.com/@bobbyzeraa" target="_blank" rel="noopener noreferrer" class="link-card btn-tiktok w-full py-3 px-4 rounded-xl font-bold text-center text-base flex items-center justify-center space-x-3 shadow-lg">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93v6.76c-.02 2.87-2.02 5.51-4.83 6.03-2.91.54-6.04-.46-7.85-2.81-1.78-2.31-1.84-5.61-.13-7.98 1.48-2.06 4.17-3.04 6.64-2.58v4.06c-1.4-.24-2.92.1-3.86 1.15-.99 1.11-1.07 2.88-.2 4.07.83 1.14 2.45 1.51 3.79 1.05 1.34-.46 2.22-1.74 2.24-3.18V.02z"/></svg>
                <span>TikTok</span>
            </a>

            <a href="https://www.instagram.com/bobbyzeraa/" target="_blank" rel="noopener noreferrer" class="link-card btn-instagram w-full py-3 px-4 rounded-xl font-bold text-center text-base flex items-center justify-center space-x-3 shadow-lg">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.881z"/></svg>
                <span>Instagram</span>
            </a>
        </div>
        
        <footer class="text-slate-300 text-xs mt-6 pb-2 drop-shadow">
            &copy; 2026 Bobbyzera.
        </footer>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const links = document.querySelectorAll('.link-card');
            
            links.forEach((link, index) => {
                setTimeout(() => {
                    link.classList.add('show');
                }, 300 + (100 * index));
            });
        });
    </script>
</body>
</html>
